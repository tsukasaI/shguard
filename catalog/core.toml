# The embedded core catalog: shell builtins and read-mostly tools.
#
# Every row lists only options that mean the same thing, with the same value
# shape, on BSD/macOS and GNU, so the grammar matches whichever the host has
# (rg and tokei have one implementation). coreutils and grep rows are
# `strict`: BSD getopt stops at the first operand, so an option after an
# operand is Unknown here. A command a row covers is Allow unless a rule
# below raises it; Allow means the parser and catalog read the whole
# command, nothing more. An option a row lacks makes the command Unknown.
#
# Writing rows (cp, rm, mkdir, uniq) are Allowed only for relative paths: an
# absolute or `~` path is an Ask, and a few targets are a Block.

# The shell builtin. `-e` and `-@` are left out (bash only / not everywhere).
# `cd` with no operand goes to $HOME and is a plain Allow here.
[[row]]
key = ["cd"]
source = "https://www.gnu.org/software/bash/manual/html_node/Bourne-Shell-Builtins.html https://man.freebsd.org/cgi/man.cgi?query=cd"
order = "strict"
dashdash = "ends"
positionals = ["path"]
changes_cwd = true
[[row.opt]]
short = "L"
[[row.opt]]
short = "P"

[[row]]
key = ["pwd"]
source = "https://www.gnu.org/software/coreutils/manual/html_node/pwd-invocation.html https://man.freebsd.org/cgi/man.cgi?query=pwd"
order = "strict"
dashdash = "ends"
positionals = []
[[row.opt]]
short = "L"
[[row.opt]]
short = "P"

# BSD /bin/echo knows only -n; -e and -E are kept because the shell builtins
# read them. This only changes the printed text. `--` is text, not an end marker.
