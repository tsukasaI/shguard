# Ask: a recursive search from the filesystem root or a home directory reads
# every secret under it.
[[rule]]
id = "grep-ask-recursive-broad"
key = ["grep"]
outcome = "ask"
opts = [["-r"]]
targets = [
  { pat = "/", kind = "exact" },
  { pat = "~", kind = "prefix" },
  { pat = "/Users", kind = "prefix" },
  { pat = "/home", kind = "prefix" },
  { pat = "/root", kind = "prefix" },
]

# rg is always recursive.
[[rule]]
id = "rg-ask-broad"
key = ["rg"]
outcome = "ask"
targets = [
  { pat = "/", kind = "exact" },
  { pat = "~", kind = "prefix" },
  { pat = "/Users", kind = "prefix" },
  { pat = "/home", kind = "prefix" },
  { pat = "/root", kind = "prefix" },
]

[[rule]]
