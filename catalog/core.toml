# Deleting a top-level directory recursively. The data directories (/Users,
# /home, /var, /opt, /private, /Library, /Applications) match only themselves,
# so `rm -r /var/tmp/x` is an Ask (absolute path), not a Block. A `~` word
# matches `~` and `~/` only here; anything deeper is the absolute/home Ask.
# `.` is the working directory itself; the kernel normalizes `./`, `././` and
# `.//` to it. The system roots are `under`: `/etc` and `/etc/x` hit, `/etcfoo`
# does not (it is still the absolute-path Ask).
[[rule]]
id = "rm-recursive-dangerous-target"
key = ["rm"]
outcome = "block"
opts = [["-r", "-R"]]
targets = [
  { pat = "/", kind = "exact" },
  { pat = "~", kind = "exact" },
  { pat = ".", kind = "exact" },
  { pat = "/Users", kind = "exact" },
  { pat = "/home", kind = "exact" },
  { pat = "/var", kind = "exact" },
  { pat = "/opt", kind = "exact" },
  { pat = "/private", kind = "exact" },
  { pat = "/Library", kind = "exact" },
  { pat = "/Applications", kind = "exact" },
  { pat = "/etc", kind = "under" },
  { pat = "/usr", kind = "under" },
  { pat = "/bin", kind = "under" },
  { pat = "/sbin", kind = "under" },
  { pat = "/lib", kind = "under" },
  { pat = "/lib32", kind = "under" },
  { pat = "/lib64", kind = "under" },
  { pat = "/System", kind = "under" },
]

# Block: device files, shell init and tool config, secrets and the project's
# own hook and config directories. The directories are `under`: `.git` and
# `.git/hooks/x` hit, `.github` and `.gitignore` do not, and `/dev` does not
# cover `/devops`. The kernel normalizes relative paths before it compares
# them (`././.git` and `.//.git` are `.git`) and folds ASCII case (`.GIT` is
# `.git`, as on a case-insensitive macOS volume). A path that reaches `.git`
# below another directory is not matched.
[[rule]]
id = "cp-block-sensitive-target"
key = ["cp"]
outcome = "block"
targets = [
  { pat = "/dev", kind = "under" },
  { pat = ".claude", kind = "under" },
  { pat = ".git", kind = "under" },
  { pat = ".cargo", kind = "under" },
  { pat = ".husky", kind = "under" },
  { pat = ".githooks", kind = "under" },
  { pat = ".mcp.json", kind = "exact" },
  { pat = ".envrc", kind = "exact" },
  { pat = "lefthook.yml", kind = "exact" },
  { pat = "lefthook.yaml", kind = "exact" },
  { pat = ".lefthook.yml", kind = "exact" },
  { pat = ".lefthook.yaml", kind = "exact" },
  { pat = "~/.bashrc", kind = "prefix" },
  { pat = "~/.bash_profile", kind = "prefix" },
  { pat = "~/.bash_login", kind = "prefix" },
  { pat = "~/.profile", kind = "prefix" },
  { pat = "~/.zshrc", kind = "prefix" },
  { pat = "~/.zshenv", kind = "prefix" },
  { pat = "~/.zprofile", kind = "prefix" },
  { pat = "~/.zlogin", kind = "prefix" },
  { pat = "~/.config/fish", kind = "prefix" },
  { pat = "~/.config/shguard", kind = "prefix" },
  { pat = "~/.config/git", kind = "prefix" },
  { pat = "~/.config/autostart", kind = "prefix" },
  { pat = "~/.config/systemd", kind = "prefix" },
