# Ask: the kernel has no working directory, so it cannot tell a path inside the
# project from one outside. Only relative paths are Allowed for writing rows.
# A word that starts with `^` is asked as well: zsh reads `^foo` as a glob
# that matches everything except `foo`, and the lexer does not see it as one.
[[rule]]
id = "cp-ask-nonlocal-target"
key = ["cp"]
outcome = "ask"
targets = [
  { pat = "/", kind = "prefix" },
  { pat = "~", kind = "prefix" },
  { pat = "^", kind = "prefix" },
]

[[rule]]
id = "rm-ask-nonlocal-target"
key = ["rm"]
outcome = "ask"
targets = [
  { pat = "/", kind = "prefix" },
