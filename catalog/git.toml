# The embedded git catalog: read-only subcommands and `push`.
#
# git has one implementation, parses options with parse-options (options
# may follow operands, `--opt=value`, `--` ends options), and the rows cite
# its own documentation. A long option matches by its full name only: git
# accepts abbreviations (`--out` for `--output`), which are Unknown here.
# An option a row lacks makes the command Unknown, hence asked.
#
# Allow means the parser and catalog read the whole command, nothing more.
# git also reads repo-local config and hooks (`core.pager`, `core.fsmonitor`,
# `diff.external`, `diff.<driver>.textconv`): that is the environment
# assumption P3, not something a row can check.


# The parent row. It lists no option on purpose: a global option (`-C`,
# `-c`, `--git-dir`, `--work-tree`, `--no-pager`, `--exec-path`) changes the
# directory, the config or the program run, so `git -C /x status` is Unknown
# and asked. `cd /x && git status` is not: after a `cd` the kernel asks only
# relative path words, and `git status` has none (a needs-decision issue).
# The row takes no operand either, so any subcommand without a row below
# (`reset`, `clean`, `checkout`, `commit`, `rebase`, ...) is Unknown and
# asked; they have no rows, hence no rules.
[[row]]
key = ["git"]
source = "https://git-scm.com/docs/git"
order = "strict"
dashdash = "ends"
positionals = []

# Left out: --output (writes a file), --ext-diff and --textconv (run
# configured programs), --show-signature (runs gpg; the `%G?`-style format
# placeholders of --pretty/--format still do, which is P3), -O<orderfile>, -L, -c,
# -C, --no-pager (a global option), -<number> and the abbreviated long
# options (git accepts `--max-c=5`; here only the full name matches).
# Revisions and paths share one operand slot, so both take the `path` role:
# a range (`a..b`) is fine, but a `..` path segment is asked.
[[row]]
key = ["git", "log"]
source = "https://git-scm.com/docs/git-log https://git-scm.com/docs/git-rev-list https://git-scm.com/docs/diff-options"
order = "permute"
dashdash = "ends"
