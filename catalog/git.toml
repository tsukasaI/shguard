[[row.opt]]
short = "n"
long = "dry-run"
[[row.opt]]
short = "v"
long = "verbose"
[[row.opt]]
short = "q"
long = "quiet"
[[row.opt]]
long = "follow-tags"
[[row.opt]]
long = "porcelain"
[[row.opt]]
long = "progress"
[[row.opt]]
short = "f"
long = "force"
[[row.opt]]
long = "force-with-lease"
value = { optional = "inert" }
[[row.opt]]
long = "force-if-includes"

# Rules. A rule only raises a decision.

# A forced push can overwrite remote history.
[[rule]]
id = "git-push-force"
key = ["git", "push"]
opts = [["-f", "--force"]]
outcome = "block"

# `+refspec` forces that one update, like --force.
[[rule]]
id = "git-push-plus-refspec"
key = ["git", "push"]
targets = [{ pat = "+", kind = "prefix" }]
outcome = "block"

# A lease check is weaker than a plain push but still rewrites history.
[[rule]]
id = "git-push-force-with-lease"
key = ["git", "push"]
opts = [["--force-with-lease", "--force-if-includes"]]
outcome = "ask"

# `:ref` deletes the remote ref.
[[rule]]
id = "git-push-delete-refspec"
key = ["git", "push"]
targets = [{ pat = ":", kind = "prefix" }]
outcome = "ask"

# A URL remote sends the commits to a host or path the repository's remotes
# may not name. The kernel compares normalized words, so `https://h/r` is
# matched as `https:/h/r` and the targets are written as `https:`.
# `file://` reaches any local path, like the absolute-path rule below.
# Not covered: the scp form `user@host:path` and other `<scheme>://`
# remotes run through a `git-remote-<scheme>` helper; no prefix names them.
[[rule]]
id = "git-push-url-remote"
key = ["git", "push"]
targets = [
  { pat = "https:", kind = "prefix" },
  { pat = "http:", kind = "prefix" },
  { pat = "ssh:", kind = "prefix" },
  { pat = "git:", kind = "prefix" },
  { pat = "git+ssh:", kind = "prefix" },
  { pat = "ssh+git:", kind = "prefix" },
  { pat = "file:", kind = "prefix" },
]
outcome = "ask"

# `ext::cmd` is a remote helper that runs a command.
[[rule]]
id = "git-push-ext-remote"
key = ["git", "push"]
targets = [{ pat = "ext::", kind = "prefix" }]
outcome = "ask"

# An absolute or `~` path (a local remote, a file outside the repository,
# an `-X` exclude file) is asked: `git diff ~/.ssh/k /dev/null` outside a
# repository prints the file. A relative local remote (`git push sub/repo
# main`, `git push . main:x`) is not: a target cannot tell it from a refspec.
[[rule]]
id = "git-absolute-path"
key = ["git"]
targets = [{ pat = "/", kind = "prefix" }, { pat = "~", kind = "prefix" }]
outcome = "ask"
