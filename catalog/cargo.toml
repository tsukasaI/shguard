# Ask: an absolute or `~` manifest path can point at a project outside the
# working tree, whose build.rs would run. The same targets cover the words
# after `--` for clippy and fmt; clippy and fmt also ask for the rustc and
# rustfmt flags that load code, change the toolchain or write files.
[[rule]]
id = "cargo-build-ask-nonlocal-target"
key = ["cargo", "build"]
outcome = "ask"
targets = [
  { pat = "/", kind = "prefix" },
  { pat = "~", kind = "prefix" },
  { pat = "^", kind = "prefix" },
]

[[rule]]
id = "cargo-check-ask-nonlocal-target"
key = ["cargo", "check"]
outcome = "ask"
targets = [
  { pat = "/", kind = "prefix" },
  { pat = "~", kind = "prefix" },
  { pat = "^", kind = "prefix" },
]

[[rule]]
id = "cargo-test-ask-nonlocal-target"
key = ["cargo", "test"]
outcome = "ask"
targets = [
  { pat = "/", kind = "prefix" },
  { pat = "~", kind = "prefix" },
  { pat = "^", kind = "prefix" },
  { pat = "--logfile", kind = "prefix" },
]

[[rule]]
id = "cargo-doc-ask-nonlocal-target"
key = ["cargo", "doc"]
outcome = "ask"
targets = [
  { pat = "/", kind = "prefix" },
  { pat = "~", kind = "prefix" },
  { pat = "^", kind = "prefix" },
]

[[rule]]
id = "cargo-clippy-ask-nonlocal-target"
key = ["cargo", "clippy"]
outcome = "ask"
targets = [
  { pat = "/", kind = "prefix" },
  { pat = "~", kind = "prefix" },
  { pat = "^", kind = "prefix" },
  { pat = "-Z", kind = "prefix" },
  { pat = "-C", kind = "prefix" },
  { pat = "--codegen", kind = "prefix" },
  { pat = "-L", kind = "prefix" },
  { pat = "-o", kind = "prefix" },
  { pat = "--out-dir", kind = "prefix" },
  { pat = "--emit", kind = "prefix" },
  { pat = "--print", kind = "prefix" },
  { pat = "--extern", kind = "prefix" },
  { pat = "--sysroot", kind = "prefix" },
  { pat = "--target", kind = "prefix" },
  { pat = "--remap-path-prefix", kind = "prefix" },
  { pat = "--pretty", kind = "prefix" },
  { pat = "@", kind = "prefix" },
  # rustc reads short-option clusters (getopts): after a flag that takes no
  # value, the rest of the word is the next option, so `-go/tmp/x` is
  # `-g -o /tmp/x`. Ask every word that starts with such a flag (the ASCII
  # fold covers `-G`, `-V`, `-H`; `-O` is caught by `-o`, `-l` by `-L`).
  { pat = "-g", kind = "prefix" },
  { pat = "-v", kind = "prefix" },
  { pat = "-h", kind = "prefix" },
]

[[rule]]
id = "cargo-fmt-ask-nonlocal-target"
key = ["cargo", "fmt"]
outcome = "ask"
targets = [
  { pat = "/", kind = "prefix" },
  { pat = "~", kind = "prefix" },
  { pat = "^", kind = "prefix" },
  { pat = "--print-config", kind = "prefix" },
  { pat = "--emit", kind = "prefix" },
  { pat = "--config-path", kind = "prefix" },
]
