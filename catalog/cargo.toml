# The embedded cargo catalog: build, test, check, clippy, fmt and doc.
#
# These are normal rows, so they can be Allowed. A build runs the project's
# build.rs and proc macros, and a test runs its test binary; that is repo code
# and falls under P3 (the repo is trusted to that extent), which the threat
# model documents. What the rows do not list is what keeps cargo from running
# code or config that the command line names:
#   - `run`, `install`, `bench`, `fix`, `clippy --fix`, `doc --open` (browser);
#   - `--config`, `-Z` and the other unstable flags, `--target-dir`,
#     `--artifact-dir`, `--lockfile-path`, `--timings`, `--target`, `-C`;
#   - `+toolchain`: the parent row has no options and rejects `+words`, so
#     `cargo +nightly build` is Unknown, and so is `cargo -Z x build`.
# `cargo fmt` without `--check` rewrites source files in place.
# A build also downloads from the registry the repo's `.cargo/config.toml`
# names and runs the dependencies' build.rs and proc macros; no allowed
# option names a host. Aliases in that config can replace `fmt` and
# `clippy`. All of that is the repo's own config, P3.
#
# `-p/--package`, `--bin`, `--example`, `--test` and `--bench` take an
# optional value in clap, but the rows give them `takes`, so the kernel
# reads the next word as their value even when it starts with `-`. That
# hides the word from the rules; cargo itself stops with a list of targets
# before building when such a value is missing. `optional` would make the
# common spaced form (`-p shguard`) an operand, and so Unknown.
#
# `--` ends cargo's options (`dashdash = "ends"`); what follows goes to the
# child program, so a `--config` after `--` is not cargo's. test, clippy and
# fmt: the words after `--` are read as paths, so the rules below can Ask
# for the flags of the test binary, rustc and rustfmt that load code or
# write files (`--logfile`, `-Z`, `-C`, `@argfile`, `--print-config`, ...).
# clippy and fmt also take these words before `--` (cargo passes unknown
# operands on); they are the same `path` words, so the same rules see them.
# build, check and doc have no operands, so a word after `--` is Unknown.
#
# cargo reads `.cargo/config.toml` from the working directory and its
# parents, and a build runs the package's build.rs, so every row is
# `cwd_sensitive`: `cd /x && cargo build` is asked.

[[row]]
key = ["cargo"]
source = "https://doc.rust-lang.org/cargo/commands/index.html"
cwd_sensitive = true
order = "permute"
dashdash = "ends"

[[row]]
key = ["cargo", "build"]
source = "https://doc.rust-lang.org/cargo/commands/cargo-build.html"
cwd_sensitive = true
order = "permute"
dashdash = "ends"
opt = [
  { short = "p", long = "package", value = { takes = "inert" } },
  { long = "workspace" },
  { long = "exclude", value = { takes = "inert" } },
  { long = "lib" },
  { long = "bins" },
  { long = "bin", value = { takes = "inert" } },
  { long = "examples" },
  { long = "example", value = { takes = "inert" } },
  { long = "tests" },
  { long = "test", value = { takes = "inert" } },
  { long = "benches" },
  { long = "bench", value = { takes = "inert" } },
  { long = "all-targets" },
  { short = "F", long = "features", value = { takes = "inert" } },
  { long = "all-features" },
  { long = "no-default-features" },
  { short = "r", long = "release" },
  { long = "profile", value = { takes = "inert" } },
  { long = "manifest-path", value = { takes = "path" } },
  { long = "message-format", value = { takes = "inert" } },
  { long = "color", value = { takes = "inert" } },
  { short = "j", long = "jobs", value = { takes = "inert" } },
  { long = "locked" },
  { long = "offline" },
  { long = "frozen" },
  { short = "q", long = "quiet" },
  { short = "v", long = "verbose" },
  { long = "keep-going" },
  { long = "ignore-rust-version" },
]

