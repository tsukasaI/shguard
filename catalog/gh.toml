# Rules. A rule only raises a decision.

# `-R/--repo` can name another host.
[[rule]]
id = "gh-repo-option"
key = ["gh"]
opts = [["-R", "--repo"]]
outcome = "block"

# A URL operand can name another host.
[[rule]]
id = "gh-url-operand"
key = ["gh"]
targets = [{ pat = "https:", kind = "prefix" }, { pat = "http:", kind = "prefix" }]
outcome = "block"

# A jq filter can print gh's environment, tokens included.
[[rule]]
id = "gh-jq"
key = ["gh"]
opts = [["-q", "--jq"]]
outcome = "block"
