# The embedded gh catalog: read-only `pr`, `issue` and `run` subcommands.
#
# Only commands that print what GitHub returns are rows. Left out on purpose:
# `--web`/`-w` (opens a browser), `gh api`, `gh auth`, `gh extension`,
# `gh alias` and every subcommand that edits (`merge`, `create`, `close`,
# `comment`, `rerun`, ...). A parent row has no options, so a global option
# before the subcommand (`gh -R x pr view`) and an unlisted subcommand are
# Unknown. `--watch` on `pr checks` only polls the API every `--interval`
# seconds, so it is allowed; it can run until the tool's own timeout.
#
# Blocked (owner decision, #1088): `-R/--repo` and URL operands, because a
# host in `-R host/o/r` or in `https://host/o/r/pull/1` sends the request,
# and possibly a token (`GH_ENTERPRISE_TOKEN`), to that host; and every use
# of `--jq`/`-q`, because a jq filter can print gh's environment (`env`,
# `$ENV`), tokens included. `--template` stays: gh's template functions have
# no file or exec access. The operands of `view`, `diff` and `checks` take
# the `path` role so the URL rule can see them.
#
# gh reads the working directory's git remotes to pick the repository, so
# every row is `cwd_sensitive`: `cd /x && gh pr list` is asked.

[[row]]
key = ["gh"]
source = "https://cli.github.com/manual/gh"
cwd_sensitive = true
order = "permute"
dashdash = "ends"

[[row]]
key = ["gh", "pr"]
source = "https://cli.github.com/manual/gh_pr"
cwd_sensitive = true
order = "permute"
dashdash = "ends"

[[row]]
key = ["gh", "issue"]
source = "https://cli.github.com/manual/gh_issue"
cwd_sensitive = true
order = "permute"
dashdash = "ends"

[[row]]
key = ["gh", "run"]
source = "https://cli.github.com/manual/gh_run"
cwd_sensitive = true
order = "permute"
dashdash = "ends"

# ---- gh pr ----

