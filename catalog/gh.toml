dashdash = "ends"
opt = [
  { short = "a", long = "assignee", value = { takes = "inert" } },
  { long = "app", value = { takes = "inert" } },
  { short = "A", long = "author", value = { takes = "inert" } },
  { short = "B", long = "base", value = { takes = "inert" } },
  { short = "d", long = "draft" },
  { short = "H", long = "head", value = { takes = "inert" } },
  { short = "l", long = "label", value = { takes = "inert" } },
  { short = "L", long = "limit", value = { takes = "inert" } },
  { short = "S", long = "search", value = { takes = "inert" } },
  { short = "s", long = "state", value = { takes = "inert" } },
  { long = "json", value = { takes = "inert" } },
  { short = "q", long = "jq", value = { takes = "inert" } },
  { short = "t", long = "template", value = { takes = "inert" } },
  { short = "R", long = "repo", value = { takes = "inert" } },
]

[[row]]
key = ["gh", "pr", "diff"]
