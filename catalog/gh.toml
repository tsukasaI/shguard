# The embedded gh catalog: read-only `pr`, `issue` and `run` subcommands.
#
# Only commands that print what GitHub returns are rows. Left out on purpose:
# `--web`/`-w` (opens a browser), `gh api`, `gh auth`, `gh extension`,
# `gh alias` and every subcommand that edits (`merge`, `create`, `close`,
# `comment`, `rerun`, ...). A parent row has no options, so a global option
# before the subcommand (`gh -R x pr view`) and an unlisted subcommand are
# Unknown. `--jq` runs gojq inside gh and `--template` a Go template; neither
# starts a program, but a jq filter can read gh's environment (`env`), so an
# Allow does not mean the output is free of secrets. `--watch` on
# `pr checks` only polls the API every `--interval` seconds, so it is
# allowed; it can run until the tool's own timeout. `-R/--repo` is a
# repository name, not a path.

[[row]]
key = ["gh"]
source = "https://cli.github.com/manual/gh"
order = "permute"
dashdash = "ends"

[[row]]
key = ["gh", "pr"]
source = "https://cli.github.com/manual/gh_pr"
order = "permute"
dashdash = "ends"

[[row]]
key = ["gh", "issue"]
source = "https://cli.github.com/manual/gh_issue"
order = "permute"
dashdash = "ends"

[[row]]
key = ["gh", "run"]
source = "https://cli.github.com/manual/gh_run"
order = "permute"
dashdash = "ends"

# ---- gh pr ----

[[row]]
key = ["gh", "pr", "view"]
source = "https://cli.github.com/manual/gh_pr_view"
order = "permute"
dashdash = "ends"
positionals = ["inert"]
opt = [
  { short = "c", long = "comments" },
  { long = "json", value = { takes = "inert" } },
  { short = "q", long = "jq", value = { takes = "inert" } },
  { short = "t", long = "template", value = { takes = "inert" } },
  { short = "R", long = "repo", value = { takes = "inert" } },
]

