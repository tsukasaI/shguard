    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # Pinned to the flake's Creusot release (#1022); it moves with the flake.
    ignore:
      - dependency-name: "creusot-std"
