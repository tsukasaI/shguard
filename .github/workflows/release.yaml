# Renewal: .github/dependabot.yml's github-actions entry opens a PR bumping
# each tag-pinned SHA (and its trailing version comment) automatically on
# its weekly schedule. dtolnay/rust-toolchain below is pinned to a `master`
# branch commit rather than a tag, so it is NOT covered by that automation
# (unverified whether Dependabot's github-actions updater tracks bare-branch
# pins) and still needs the manual procedure:
#   gh api repos/dtolnay/rust-toolchain/commits/master --jq '.sha'
# then: update the SHA and its `master (<date>)` comment on every dtolnay
# `uses:` line (release.yaml, main-check.yaml, fuzz-nightly.yaml).
#   - actions/checkout            (shared pin with main-check.yaml and fuzz-nightly.yaml)
#   - cachix/install-nix-action   (shared pin with main-check.yaml)
#   - dtolnay/rust-toolchain      @ master (shared pin with main-check.yaml and fuzz-nightly.yaml) -- manual renewal only, see above
#   - actions/upload-artifact
#   - actions/download-artifact
#   - softprops/action-gh-release
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-07-18); pinned per repo README, toolchain selected via `with.toolchain`
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: bash scripts/hermetic-cargo-test.sh

  # Fail-closed: build and release both need this job, so a failed or skipped
  # Darwin nix build blocks the release.
  nix-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          # Same settings and reason as main-check.yaml's nix-build.
          extra_nix_config: |
            sandbox = true
            sandbox-fallback = false
      - run: nix build -L

  build:
    needs: [test, nix-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      # Only takes effect when building aarch64-unknown-linux-gnu; harmless
      # for every other target in the matrix.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install aarch64 cross-compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-07-18); pinned per repo README, toolchain selected via `with.toolchain`
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/shguard dist/shguard-${{ matrix.target }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shguard-${{ matrix.target }}
          path: dist/shguard-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: [build, nix-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shguard-*
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum shguard-* > SHA256SUMS

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/shguard-*
            artifacts/SHA256SUMS
