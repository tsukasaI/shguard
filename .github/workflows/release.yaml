name: release

# A pushed `v*` tag builds the hook binary for the release triples (equal to
# deny.toml's `[graph] targets`) and publishes a GitHub Release with the
# binaries, SHA256SUMS and the tag's CHANGELOG section. Nothing goes to
# crates.io (`publish = false`).

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag on a main commit is not proof that `verify` passed on it, so this job
  # refuses any other commit, waits for `verify`'s push run on main for the
  # tagged SHA to succeed (#1223, #1261), and re-checks what a mistagged commit
  # would break.
  check:
    runs-on: ubuntu-latest
    # Up to 60 minutes of waiting for `verify`, plus the checks below.
    timeout-minutes: 90
    # A job-level `permissions` replaces the workflow-level set, so
    # `contents: read` is repeated; `actions: read` is for the workflow-runs API.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD
      - name: Install toolchain
        run: rustup toolchain install --no-self-update
      - name: Tag matches the crate version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "shguard") | .version')
          test "v${version}" = "${GITHUB_REF_NAME}" \
            || { echo "tag ${GITHUB_REF_NAME} != crate version ${version}"; exit 1; }
      - name: CHANGELOG has a section for the version
        run: grep -qF -- "## ${GITHUB_REF_NAME#v} " CHANGELOG.md
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      # Last, so a local failure is reported without waiting. Fail closed: only
      # `verify`'s push runs on main for this SHA count, so a pull_request run
      # attached to the same commit cannot satisfy it. Every matching run must
      # be `success`; a missing, queued or running run is waited for until the
      # deadline, then fails. A completed run with any other conclusion fails
      # at once, not waited on. A re-run keeps its run id and reports the
      # latest attempt, so no newest-run selection is needed. Ten consecutive
      # API failures also fail, so a permanent error is not mistaken for a
      # missing run.
      - name: verify's push run on main succeeded on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          deadline=$((SECONDS + 3600))
          failures=0
          while :; do
            if ! runs=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/verify.yaml/runs?head_sha=${GITHUB_SHA}&event=push&branch=main&per_page=100" \
              | jq -s '[.[].workflow_runs[]]'); then
              failures=$((failures + 1))
              echo "::warning::cannot read verify runs (attempt ${failures})"
              test "${failures}" -lt 10 \
                || { echo "::error::workflow-runs API failed ${failures} times in a row"; exit 1; }
              sleep 30
              continue
            fi
            failures=0
            state=$(jq -r '
              def known: ["queued", "in_progress", "waiting", "pending", "requested"];
              def bad: select(.status != "completed" and (.status | IN(known[]) | not));
              if length == 0 then "missing"
              elif any(.[]; .status == "completed" and .conclusion != "success") then
                "failed " + ([.[] | select(.status == "completed" and .conclusion != "success")
                              | "\(.id)=\(.conclusion)"] | join(","))
              elif any(.[]; .status != "completed" and (.status | IN(known[]) | not)) then
                "unknown " + ([.[] | bad | "\(.id)=\(.status)"] | join(","))
              elif any(.[]; .status != "completed") then "pending"
              else "success"
              end' <<< "${runs}")
            echo "verify push run on main: ${state}"
            case "${state}" in
              success) exit 0 ;;
              missing | pending) ;;
              *) echo "::error::verify push run on main is ${state}; re-run that verify run (gh run rerun <id>), then re-run this job"; exit 1 ;;
            esac
            test "${SECONDS}" -lt "${deadline}" \
              || { echo "timed out waiting for verify's push run"; exit 1; }
            sleep 30
          done

  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          # Native arm runner: no cross linker to configure.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup target add ${{ matrix.target }}
      - run: cargo build --locked --release -p shguard --target ${{ matrix.target }}
      # x86_64 Darwin is cross-built on an arm runner, so it is not run here.
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        run: target/${{ matrix.target }}/release/shguard --version
      - name: Stage binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/shguard dist/shguard-${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shguard-${{ matrix.target }}
          path: dist/shguard-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shguard-*
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum shguard-* > SHA256SUMS
      # The generated notes would list every PR since v0.9.5; the CHANGELOG
      # section is the curated summary.
      - name: Release notes from CHANGELOG
        run: |
          awk -v head="## ${GITHUB_REF_NAME#v} " \
            'index($0, head) == 1 { on = 1; next } /^## / { on = 0 } on' \
            CHANGELOG.md > notes.md
          test -s notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=()
          case "${GITHUB_REF_NAME}" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" "${prerelease[@]}" \
            --verify-tag --title "${GITHUB_REF_NAME}" --notes-file notes.md \
            artifacts/shguard-* artifacts/SHA256SUMS
