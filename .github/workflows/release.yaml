name: release

# A pushed `v*` tag builds the hook binary for the release triples (equal to
# deny.toml's `[graph] targets`) and publishes a GitHub Release with the
# binaries, SHA256SUMS and the tag's CHANGELOG section. Nothing goes to
# crates.io (`publish = false`).

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag on a main commit is not proof that `verify` passed on it, so this job
  # refuses any other commit, waits for the `rust` and `proofs` check runs of
  # the tagged SHA to succeed (#1223), and re-checks what a mistagged commit
  # would break.
  check:
    runs-on: ubuntu-latest
    # Up to 60 minutes of waiting for `verify`, plus the checks below.
    timeout-minutes: 90
    # A job-level `permissions` replaces the workflow-level set, so
    # `contents: read` is repeated; `checks: read` is for the check-runs API.
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD
      - name: Install toolchain
        run: rustup toolchain install --no-self-update
      - name: Tag matches the crate version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "shguard") | .version')
          test "v${version}" = "${GITHUB_REF_NAME}" \
            || { echo "tag ${GITHUB_REF_NAME} != crate version ${version}"; exit 1; }
      - name: CHANGELOG has a section for the version
        run: grep -qF -- "## ${GITHUB_REF_NAME#v} " CHANGELOG.md
      # Fail closed: only `success` passes; a missing, queued or running run
      # is waited for until the deadline, then fails. For a re-run, the run
      # with the highest id is the latest.
      - name: verify's rust and proofs runs succeeded on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 3600))
          while :; do
            runs=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
              | jq -s '[.[].check_runs[]]') || runs='[]'
            pending=0
            for name in rust proofs; do
              state=$(jq -r --arg n "${name}" '
                [.[] | select(.name == $n)]
                | if length == 0 then "missing"
                  else max_by(.id) | if .status == "completed" then .conclusion else .status end
                  end' <<< "${runs}")
              echo "${name}: ${state}"
              case "${state}" in
                success) ;;
                missing | queued | in_progress | waiting | pending | requested) pending=1 ;;
                *) echo "check run ${name} ended as ${state}"; exit 1 ;;
              esac
            done
            test "${pending}" -eq 0 && exit 0
            test "${SECONDS}" -lt "${deadline}" \
              || { echo "timed out waiting for rust and proofs"; exit 1; }
            sleep 30
          done
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          # Native arm runner: no cross linker to configure.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup target add ${{ matrix.target }}
      - run: cargo build --locked --release -p shguard --target ${{ matrix.target }}
      # x86_64 Darwin is cross-built on an arm runner, so it is not run here.
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        run: target/${{ matrix.target }}/release/shguard --version
      - name: Stage binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/shguard dist/shguard-${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shguard-${{ matrix.target }}
          path: dist/shguard-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shguard-*
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum shguard-* > SHA256SUMS
      # The generated notes would list every PR since v0.9.5; the CHANGELOG
      # section is the curated summary.
      - name: Release notes from CHANGELOG
        run: |
          awk -v head="## ${GITHUB_REF_NAME#v} " \
            'index($0, head) == 1 { on = 1; next } /^## / { on = 0 } on' \
            CHANGELOG.md > notes.md
          test -s notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=()
          case "${GITHUB_REF_NAME}" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" "${prerelease[@]}" \
            --verify-tag --title "${GITHUB_REF_NAME}" --notes-file notes.md \
            artifacts/shguard-* artifacts/SHA256SUMS
