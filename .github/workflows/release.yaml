name: release

# A pushed `v*` tag builds the hook binary for the release triples (equal to
# deny.toml's `[graph] targets`) and publishes a GitHub Release with the
# binaries, SHA256SUMS and the tag's CHANGELOG section. Nothing goes to
# crates.io (`publish = false`).

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag on a main commit is not proof that `verify` passed on it, so this job
  # refuses any other commit, waits for `verify`'s push run on main for the
  # tagged SHA to succeed with its `rust` and `proofs` jobs (#1223, #1261,
  # #1279), and re-checks what a mistagged commit would break.
  check:
    runs-on: ubuntu-latest
    # The wait for verify's push run ends at most 120 minutes after its step
    # starts (10 if no run exists); the rest is for the checks before it and
    # the last poll.
    timeout-minutes: 150
    # A job-level `permissions` replaces the workflow-level set, so
    # `contents: read` is repeated; `actions: read` is for the workflow-runs
    # and jobs APIs.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD
      - name: Install toolchain
        run: rustup toolchain install --no-self-update
      - name: Tag matches the crate version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "shguard") | .version')
          test "v${version}" = "${GITHUB_REF_NAME}" \
            || { echo "tag ${GITHUB_REF_NAME} != crate version ${version}"; exit 1; }
      - name: CHANGELOG has a section for the version
        run: grep -qF -- "## ${GITHUB_REF_NAME#v} " CHANGELOG.md
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
      # Last, so a local failure is reported without waiting. Fail closed: only
      # `verify`'s push runs on main for this SHA count, so a pull_request run
      # attached to the same commit cannot satisfy it; the API filters are
      # re-checked on every returned run, and a mismatch counts as an API
      # failure. Every matching run must be `success`, and for each, the jobs
      # `rust` and `proofs` of its latest attempt must exist and be `success`
      # (a skipped job leaves the run green). A missing run is waited for 10
      # minutes and a queued or running one 120 minutes, both counted from the
      # start of this step, then it fails. Once a run was seen, it must be
      # missing for 3 consecutive polls to fail (one empty page is not enough),
      # still within the 120 minutes. A completed run with any other conclusion
      # fails at once, not waited on. A re-run keeps its run id and reports the
      # latest attempt, so no newest-run selection is needed. Ten consecutive
      # API failures (a failed read, a failed filter check, a failed jobs read)
      # also fail, so a permanent error is not mistaken for a missing run.
      - name: verify's push run on main succeeded on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          missing_deadline=$((SECONDS + 600))
          run_deadline=$((SECONDS + 7200))
          failures=0
          seen=0
          gone=0
          api_failed() {
            failures=$((failures + 1))
            echo "::warning::$1 (attempt ${failures})"
            test "${failures}" -lt 10 \
              || { echo "::error::$1: ${failures} API failures in a row"; exit 1; }
            sleep 30
          }
          while :; do
            if ! runs=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/verify.yaml/runs?head_sha=${GITHUB_SHA}&event=push&branch=main&per_page=100" \
              | jq -s --arg sha "${GITHUB_SHA}" '
                  [.[].workflow_runs[]]
                  | if all(.[]; .head_sha == $sha and .event == "push" and .head_branch == "main")
                    then .
                    else error("verify runs do not match head_sha/push/main")
                    end'); then
              api_failed "cannot read or validate verify runs"
              continue
            fi
            state=$(jq -r '
              def known: ["queued", "in_progress", "waiting", "pending", "requested"];
              def bad: select(.status != "completed" and (.status | IN(known[]) | not));
              if length == 0 then "missing"
              elif any(.[]; .status == "completed" and .conclusion != "success") then
                "failed " + ([.[] | select(.status == "completed" and .conclusion != "success")
                              | "\(.id)=\(.conclusion)"] | join(","))
              elif any(.[]; .status != "completed" and (.status | IN(known[]) | not)) then
                "unknown " + ([.[] | bad | "\(.id)=\(.status)"] | join(","))
              elif any(.[]; .status != "completed") then "pending"
              else "success"
              end' <<< "${runs}")
            echo "verify push run on main: ${state}"
            case "${state}" in
              success)
                seen=1
                gone=0
                ids=$(jq -r '.[].id' <<< "${runs}")
                test -n "${ids}" || { echo "::error::no verify run id to check jobs for"; exit 1; }
                for id in ${ids}; do
                  if ! jobs=$(gh api --paginate \
                    "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs?filter=latest&per_page=100" \
                    | jq -s '[.[].jobs[]]'); then
                    api_failed "cannot read the jobs of verify run ${id}"
                    continue 2
                  fi
                  problems=$(jq -r '
                    def need($n):
                      [.[] | select(.name == $n)] as $j
                      | if ($j | length) == 0 then "\($n) is absent"
                        elif all($j[]; .status == "completed" and .conclusion == "success") then empty
                        else "\($n) is " + ([$j[] | "\(.status)/\(.conclusion)"] | join(","))
                        end;
                    need("rust"), need("proofs")' <<< "${jobs}")
                  if test -n "${problems}"; then
                    echo "::error::verify run ${id}: ${problems//$'\n'/; }; re-run that verify run (gh run rerun ${id}) unless verify.yaml skips or renames the job, then re-run this job"
                    exit 1
                  fi
                done
                exit 0
                ;;
              missing)
                if test "${seen}" -eq 1; then
                  gone=$((gone + 1))
                  test "${gone}" -lt 3 \
                    || { echo "::error::verify's push run on main disappeared for 3 consecutive polls; re-run this job"; exit 1; }
                  test "${SECONDS}" -lt "${run_deadline}" \
                    || { echo "::error::verify's push run did not finish within 120 minutes of this step starting; re-run this job once that run has succeeded"; exit 1; }
                else
                  test "${SECONDS}" -lt "${missing_deadline}" \
                    || { echo "::error::no verify push run on main exists for this commit 10 minutes after this step started; if one appears later, re-run this job"; exit 1; }
                fi
                ;;
              pending)
                seen=1
                gone=0
                test "${SECONDS}" -lt "${run_deadline}" \
                  || { echo "::error::verify's push run did not finish within 120 minutes of this step starting; re-run this job once that run has succeeded"; exit 1; }
                ;;
              *) echo "::error::verify push run on main is ${state}; re-run that verify run (gh run rerun <id>), then re-run this job"; exit 1 ;;
            esac
            failures=0
            sleep 30
          done

  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          # Native arm runner: no cross linker to configure.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup target add ${{ matrix.target }}
      - run: cargo build --locked --release -p shguard --target ${{ matrix.target }}
      # x86_64 Darwin is cross-built on an arm runner, so it is not run here.
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        run: target/${{ matrix.target }}/release/shguard --version
      - name: Stage binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/shguard dist/shguard-${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shguard-${{ matrix.target }}
          path: dist/shguard-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shguard-*
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum shguard-* > SHA256SUMS
      # The generated notes would list every PR since v0.9.5; the CHANGELOG
      # section is the curated summary.
      - name: Release notes from CHANGELOG
        run: |
          awk -v head="## ${GITHUB_REF_NAME#v} " \
            'index($0, head) == 1 { on = 1; next } /^## / { on = 0 } on' \
            CHANGELOG.md > notes.md
          test -s notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=()
          case "${GITHUB_REF_NAME}" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" "${prerelease[@]}" \
            --verify-tag --title "${GITHUB_REF_NAME}" --notes-file notes.md \
            artifacts/shguard-* artifacts/SHA256SUMS
