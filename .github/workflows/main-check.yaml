# Backstop for what the lefthook pre-push gate cannot see; human PRs get no
# check here (pre-push is their merge gate).
# - push to main: tests the actual post-squash-merge tip, and on Linux (the
#   pre-push gate runs only on the maintainer's macOS machine).
# - Dependabot PRs: their branches are pushed server-side and never pass
#   through anyone's local pre-push hook.
name: Main check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push' || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master (2026-07-18); pinned per repo README, toolchain selected via `with.toolchain`
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  cargo-deny:
    if: github.event_name == 'push' || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
