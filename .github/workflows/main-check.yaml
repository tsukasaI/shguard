# Backstop for what the lefthook pre-push gate cannot see; human PRs get no
# check here (pre-push is their merge gate). Release PRs (chore/release-*) are
# covered by a local pre-push `nix build` (scripts/release-nix-build.sh), and
# release.yaml re-runs nix build at tag time.
# - push to main: tests the actual post-squash-merge tip, and on Linux (the
#   pre-push gate runs only on the maintainer's macOS machine).
# - Dependabot PRs: their branches are pushed server-side and never pass
#   through anyone's local pre-push hook.
# - workflow_dispatch: on-demand sandboxed nix-build (e.g. after a flake.lock
#   renewal); test and cargo-deny skip.
name: Main check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master (2026-07-18); pinned per repo README, toolchain selected via `with.toolchain`
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: bash scripts/hermetic-cargo-test.sh

  nix-build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          # Not the installer default: Nix defaults the sandbox off on Darwin and
          # falls back to unsandboxed builds, so the /Users denial nix-darwin
          # consumers hit (#779) would go unreproduced.
          extra_nix_config: |
            sandbox = true
            sandbox-fallback = false
      - run: nix build -L

  cargo-deny:
    if: github.event_name == 'push' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
