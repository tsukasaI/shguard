# Backstop for what the lefthook pre-push gate cannot see; human PRs get no
# check here (pre-push is their merge gate), except release PRs
# (chore/release-*), which get the sandboxed nix-build matrix.
# - push to main: tests the actual post-squash-merge tip, and on Linux (the
#   pre-push gate runs only on the maintainer's macOS machine).
# - Dependabot PRs: their branches are pushed server-side and never pass
#   through anyone's local pre-push hook.
# - Release PRs (head branch chore/release-*): nix-build on x86_64-linux
#   (ubuntu-latest) and aarch64-darwin (macos-latest), because the Darwin nix
#   sandbox is not reproducible by the local gate.
name: Main check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master (2026-07-18); pinned per repo README, toolchain selected via `with.toolchain`
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Mirrors lefthook's rust-test: the nix checkPhase has no HOME or config.
      - run: env -u SHGUARD_CONFIG -u XDG_CONFIG_HOME -u SHGUARD_STRICT_CONFIG CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" HOME=/homeless-shelter cargo test

  nix-build:
    if: github.event_name == 'push' || github.event.pull_request.user.login == 'dependabot[bot]' || startsWith(github.head_ref, 'chore/release-')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          # Not the installer default: Nix defaults the sandbox off on Darwin and
          # falls back to unsandboxed builds, so the /Users denial nix-darwin
          # consumers hit (#779) would go unreproduced.
          extra_nix_config: |
            sandbox = true
            sandbox-fallback = false
      - run: nix build -L

  cargo-deny:
    if: github.event_name == 'push' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
