name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain rust-toolchain.toml names (#1013).
      - name: Install toolchain
        run: rustup toolchain install --no-self-update
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      # The spike has its own lockfile. A nix-form one, with no source or
      # checksum for creusot-std, must not land there either (#1020).
      - name: Spike lockfile is the registry form
        run: cargo metadata --locked --format-version 1 --manifest-path spikes/lattice/Cargo.toml > /dev/null
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # Creusot runs on its own nightly toolchain from the flake; production code
  # stays on stable (the `rust` job).
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      # Read the why3find artifact of main's last green push run (#1052).
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # install-nix-action passes GITHUB_TOKEN into nix.conf as an
      # access-token whatever `github_access_token` says (v31.10.7
      # install-nix.sh falls back to it), so leaving that input empty changes
      # nothing. The token is this job's read-only one on a public repo, and it
      # grants nothing beyond a higher rate limit (#1016).
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31.10.7
      # The Creusot overlay (creusot-rustc, why3, the solvers) has no binary
      # cache and takes about 70 minutes to build from source, so /nix is kept
      # in the Actions cache keyed by the flake (#1014). Runs restore an exact
      # or newest-prefix match. Only pushes to main save (#1052), so nothing a
      # PR builds is ever restored. A PR that bumps the flake rebuilds on
      # each run.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: ${{ github.event_name == 'push' }}
      # verif/ is not committed (#1005), so CI translates from source. Solver
      # versions are pinned by flake.lock, and why3find.json selects the
      # provers, tactics and timeouts.
      #
      # Solver results are reused from why3find's cache (.why3find/). It holds
      # per-prover {status, time} entries keyed by goal digest, so a changed
      # goal is always proved again, but one forged "Valid" entry fakes a
      # proof. So the cache comes only from the artifact that main's last
      # green push run uploaded (#1052). Every run, PR or main, restores that
      # one and nothing else. PR runs never upload it. Never run PR code in a
      # workflow that runs in main's ref context (pull_request_target,
      # workflow_run, schedule). A missing artifact only means proving from
      # scratch.
      # The artifact name carries the solver and prover setup, so results
      # from another flake or why3find.json are never mixed in. A job-level
      # `env` cannot use `runner` or `hashFiles`, so a step exports it.
      - name: Restore why3find results from main
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: why3find-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'why3find.json', 'spikes/lattice/why3find.json') }}
        run: |
          echo "WHY3FIND_ARTIFACT=$ARTIFACT" >> "$GITHUB_ENV"
          WHY3FIND_ARTIFACT=$ARTIFACT
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow verify.yaml --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ] && gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$WHY3FIND_ARTIFACT" --dir .; then
            echo "restored $WHY3FIND_ARTIFACT from run $run_id"
          else
            echo "no $WHY3FIND_ARTIFACT from main; proving from scratch"
          fi
      # rust-toolchain.toml pins the `rust` job and the release build to the
      # devShell's rustc (#1013). This step fails when a flake bump moves
      # only one of them.
      - name: Toolchain parity
        run: |
          want=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          have=$(nix develop -c rustc --version | cut -d' ' -f2)
          echo "rust-toolchain.toml: $want, devShell: $have"
          test -n "$want" && test "$want" = "$have"
      - name: Prove spike
        working-directory: spikes/lattice
        run: nix develop ../.. -c cargo creusot --span-mode relative
      - name: Prove kernel
        working-directory: crates/shguard-kernel
        run: nix develop ../.. -c cargo creusot --span-mode relative
      # The shfmt and bash 5 oracles live in the devShell, so the ignored
      # differential tests run here rather than in the `rust` job.
      - name: Differential tests
        if: ${{ !cancelled() }}
        run: nix develop -c cargo test -p shguard-syntax --locked -- --include-ignored --nocapture
      # Last step, so only a fully green push run on main uploads.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.WHY3FIND_ARTIFACT }}
          path: |
            .why3find
            spikes/lattice/.why3find
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
