name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # Creusot runs on its own nightly toolchain from the flake; production code
  # stays on stable (the `rust` job).
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31.10.7
      # The Creusot overlay (creusot-rustc, why3, the solvers) has no binary
      # cache and takes about 70 minutes to build from source, so /nix is kept
      # in the Actions cache keyed by the flake (#1014). PR runs restore an
      # exact or newest-prefix match from their own scope, then main's; only
      # successful runs save.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      # verif/ is not committed (#1005), so CI translates from source; solver
      # versions are pinned by flake.lock; why3find.json selects provers,
      # tactics and timeouts.
      #
      # Solver results are reused from why3find's cache (.why3find/): per-prover
      # {status, time} entries keyed by goal digest, so a changed goal is
      # always proved again, but one forged "Valid" entry fakes a proof. Only
      # main saves it (the last step, so only a fully green run). PR runs
      # restore their own scope first, then main's, so the main push run,
      # which sees main's scope only, is the authoritative proof. Never let PR
      # runs save it, and never run PR code in a workflow that runs in main's
      # ref context (pull_request_target, workflow_run, schedule).
      - id: why3find-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .why3find
            spikes/lattice/.why3find
          key: why3find-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'why3find.json', 'spikes/lattice/why3find.json') }}-${{ github.sha }}
          restore-keys: why3find-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'why3find.json', 'spikes/lattice/why3find.json') }}-
      - name: Prove spike
        working-directory: spikes/lattice
        run: nix develop ../.. -c cargo creusot --span-mode relative
      - name: Prove kernel
        working-directory: crates/shguard-kernel
        run: nix develop ../.. -c cargo creusot --span-mode relative
      # The shfmt and bash 5 oracles live in the devShell, so the ignored
      # differential tests run here rather than in the `rust` job.
      - name: Differential tests
        run: nix develop -c cargo test -p shguard-syntax --locked -- --include-ignored
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .why3find
            spikes/lattice/.why3find
          key: ${{ steps.why3find-cache.outputs.cache-primary-key }}
