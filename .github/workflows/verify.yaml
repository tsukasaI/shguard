name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # Creusot runs on its own nightly toolchain from the flake; production code
  # stays on stable (the `rust` job).
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31.10.7
      # verif/ is not committed (#1005), so CI proves from source; the solvers
      # and their versions are pinned by flake.lock and why3find.json.
      - name: Prove spike
        working-directory: spikes/lattice
        run: nix develop ../.. -c cargo creusot --span-mode relative
      # Add the kernel once it depends on creusot-std (M3):
      #   working-directory: crates/shguard-kernel
      #   run: nix develop ../.. -c cargo creusot --span-mode relative
