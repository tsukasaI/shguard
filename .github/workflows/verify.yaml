name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # Creusot runs on its own nightly toolchain from the flake; production code
  # stays on stable (the `rust` job).
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31.10.7
      # The Creusot overlay (creusot-rustc, why3, the solvers) has no binary
      # cache and takes about 70 minutes to build from source, so /nix is kept
      # in the Actions cache keyed by the flake (#1014). PR runs restore an
      # exact or newest-prefix match from their own scope, then main's; only
      # successful runs save.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      # verif/ is not committed (#1005), so CI proves from source; solver
      # versions are pinned by flake.lock; why3find.json selects provers,
      # tactics and timeouts.
      - name: Prove spike
        working-directory: spikes/lattice
        run: nix develop ../.. -c cargo creusot --span-mode relative
      - name: Prove kernel
        working-directory: crates/shguard-kernel
        run: nix develop ../.. -c cargo creusot --span-mode relative
