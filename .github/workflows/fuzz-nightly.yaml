# Nightly sweep of the differential fuzzer (tests/fuzz_differential.rs,
# issue #93): runs with a much larger iteration count and a run-specific
# seed than the always-on `cargo test` default, and auto-files a GitHub
# issue when the sweep fails -- which it does whenever a divergence's
# RootCause is Novel (an unrecognized argv-shape gap), or whenever ANY
# divergence's decision is Allow, even a known-shape one (see
# tests/fuzz_differential.rs's `RootCause`/`classify_root_cause` and the
# main sweep's assertions). Issues are deduped by a hash of the divergence's
# shape SIGNATURE (tests/fuzz_differential.rs's `diff_signature`), not the
# raw candidate string, so templated variants of the same underlying gap
# collapse to one tracked issue instead of each looking like a fresh
# finding (issue #93's own history: 62 issues filed over 7 nights for what
# turned out to be one meta-family). See CONTRIBUTING.md's "Triaging a
# fuzzer-found divergence" section for what happens after an issue lands
# here.

name: Fuzz nightly

on:
  schedule:
    # 03:17 UTC daily -- off an hourly boundary to avoid the GitHub Actions
    # scheduler's own top-of-hour load spike.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-18); pinned per repo README, toolchain selected via `with.toolchain`
        with:
          toolchain: stable

      - name: Run differential fuzzer
        id: fuzz
        env:
          # `github.run_id` is unique and monotonically increasing per run,
          # so nightly sweeps don't all repeat the exact same PRNG sequence
          # the way the hardcoded `cargo test` default does.
          SHGUARD_FUZZ_SEED: ${{ github.run_id }}
          SHGUARD_FUZZ_ITERATIONS: 5000
          SHGUARD_FUZZ_REPORT_PATH: ${{ runner.temp }}/shguard-fuzz-report.jsonl
        run: cargo test --test fuzz_differential -- --nocapture

      - name: File an issue for any new divergence
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHGUARD_FUZZ_REPORT_PATH: ${{ runner.temp }}/shguard-fuzz-report.jsonl
        run: |
          set -euo pipefail
          REPORT="$SHGUARD_FUZZ_REPORT_PATH"

          if [[ ! -s "$REPORT" ]]; then
            echo "fuzz step failed but no report file was written -- likely a harness bug, not a divergence. Not filing an issue; check the job log above."
            exit 0
          fi

          gh label create fuzz-divergence \
            --color b60205 \
            --description "Auto-filed by the nightly differential fuzzer (issue #93)" \
            --force

          # Only a genuinely NEW-shape divergence (RootCause::Novel), or ANY
          # divergence whose decision is Allow (even a known-shape one --
          # the one direction that can be a real bypass, never silently
          # excused by a known RootCause; see tests/fuzz_differential.rs's
          # main sweep assertions), should ever reach this report file in
          # the first place -- the fuzz test itself only fails on those --
          # but filter defensively rather than trust that invariant blindly.
          filed_any=0
          declare -A seen_sig
          while IFS= read -r line; do
            filed_any=1
            candidate=$(jq -r '.candidate' <<<"$line")
            decision=$(jq -r '.decision' <<<"$line")
            root_cause=$(jq -r '.root_cause' <<<"$line")
            signature=$(jq -r '.signature' <<<"$line")
            shguard_argv=$(jq -r '.shguard_argv | @json' <<<"$line")
            bash_argv=$(jq -r '.bash_argv | @json' <<<"$line")
            bash_version=$(jq -r '.bash_version' <<<"$line")

            # A short hash of the SHAPE signature (not the raw candidate),
            # embedded in the title, is the dedup key -- fable review
            # follow-up (originally on the raw-candidate-string hash, issue
            # #93): searching GitHub's issue search on raw candidate text is
            # fragile (candidates routinely contain `"` and other search-
            # significant characters that unbalance the search phrase), and
            # a templated mutator produces textually-distinct candidates for
            # the SAME underlying gap every night, so hashing the candidate
            # string filed a fresh issue per template variant (62 issues
            # over 7 nights for one meta-family). Hashing `signature`
            # instead collapses those variants to one tracked issue. The
            # `decision` is folded into the hash too, so an Allow-direction
            # instance of an otherwise-already-tracked shape still gets its
            # own distinct issue rather than silently deduping against a
            # previously-filed Ask/Block-direction instance of the same
            # shape -- the one direction that must never look "already
            # handled" just because its shape isn't new.
            dedup_hash=$(printf '%s|%s' "$signature" "$decision" | sha256sum | cut -c1-12)
            title="fuzz: shguard/bash argv divergence (${dedup_hash})"

            # In-loop guard against a same-run race: two divergences with
            # the same dedup_hash in the SAME report file would otherwise
            # both do "search -> not found -> create" before either's
            # `gh issue create` is visible to the other's `gh issue list
            # --search` (fable review follow-up: this raced 3 times in
            # practice under the old candidate-string hash, filing 3 pairs
            # of byte-identical duplicate issues in one run).
            if [[ -n "${seen_sig[$dedup_hash]:-}" ]]; then
              echo "Skipping duplicate for candidate (same signature+decision already filed this run, in #${seen_sig[$dedup_hash]}): $candidate"
              continue
            fi

            existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label fuzz-divergence --state open \
              --search "in:title \"${dedup_hash}\"" --json number --jq '.[0].number // empty')
            if [[ -n "$existing" ]]; then
              echo "Skipping duplicate for candidate (already tracked in #$existing): $candidate"
              seen_sig[$dedup_hash]=$existing
              continue
            fi

            # Built as an array of lines (each element a plain, non-heredoc
            # string) rather than a heredoc: this `run:` block is itself a
            # YAML literal block nested inside a `while` loop, so a heredoc's
            # closing delimiter would need to sit at column 0 to be
            # recognized -- easy to break silently on the next edit. An
            # array + `printf '%s\n'` join has no such indentation trap.
            lines=(
              "Auto-filed by the nightly differential fuzzer (\`.github/workflows/fuzz-nightly.yaml\`, issue #93)."
              ""
              "**Candidate**"
              ""
              "\`\`\`"
              "$candidate"
              "\`\`\`"
              ""
              "**shguard decision:** $decision"
              ""
              "**root cause:** $root_cause"
              ""
              "**shguard normalized argv:**"
              "\`\`\`json"
              "$shguard_argv"
              "\`\`\`"
              ""
              "**real bash argv ($bash_version):**"
              "\`\`\`json"
              "$bash_argv"
              "\`\`\`"
              ""
              "See CONTRIBUTING.md's \"Triaging a fuzzer-found divergence\" section for how to reproduce this locally and decide which of the three buckets it falls into (genuine new bypass class, over-strict false positive, or harness bug)."
            )
            body=$(printf '%s\n' "${lines[@]}")

            issue_url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label fuzz-divergence --body "$body")
            seen_sig[$dedup_hash]="${issue_url##*/}"
          done < <(jq -c 'select(.root_cause == "Novel" or .decision == "Allow")' "$REPORT")

          if [[ "$filed_any" -eq 0 ]]; then
            echo "Report file was non-empty but contained no Novel/Allow-direction entries -- nothing to file."
          fi
