[package]
name = "shguard"
version = "0.9.5"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Parse-then-decide PreToolUse hook that blocks dangerous shell commands for AI coding agents"
repository = "https://github.com/tsukasaI/shguard"
readme = "README.md"
keywords = ["security", "shell", "cli", "hooks", "claude"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "rules/**", "tests/**", "/Cargo.toml", "/README.md", "/CHANGELOG.md", "/LICENSE-*"]

[[bin]]
name = "shguard"
path = "src/bin/shguard.rs"

[dependencies]
# Pinned exactly per docs/adr/0001-parser-crate.md; staying on 0.4.0 (not the
# brush-ocap rc line, no fork) is recorded in
# docs/adr/0003-brush-parser-stay-on-0.4.0.md. The fixture corpus in
# src/parser.rs is the upgrade-compatibility gate for any version bump.
brush-parser = "=0.4.0"
# rust-lang-maintained raw libc bindings — used for RSS measurement in the
# two memory watchdogs (`getrusage(RUSAGE_SELF, ...)` in src/bin/shguard.rs,
# `sysconf`/`proc_pidinfo` in src/watchdog.rs) and for `O_NOFOLLOW` on the
# decision-log open in src/decision_log.rs. Not exact-pinned: unlike
# brush-parser above/url below there is no upgrade-compatibility gate this
# crate's version bumps could break (it is a thin, stable FFI surface, not
# a parser whose behavior shguard depends on matching exactly).
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
toml = "1.1.3"
# Pinned exactly per docs/adr/0002-url-crate.md — except_targets' opt-in
# url_host matcher's own regression tests are the upgrade-compatibility
# gate for any version bump (host extraction is security-relevant here).
url = "=2.5.8"

# Per coding-guidelines/languages/rust.md: default clippy groups promoted
# to deny, plus a small cherry-picked set of pedantic/nursery lints — NEVER
# `clippy::pedantic = "warn"` or `clippy::nursery = "warn"` wholesale.
[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }

unwrap_used = "warn"
expect_used = "warn"
missing_errors_doc = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# `harness = false`: libtest captures the output of a passing test, and these
# targets exist to print a number in plain `cargo test` output (issue #836).
[[test]]
name = "metrics"
harness = false

[[test]]
name = "must_not_allow"
harness = false

# The config loader reads SHGUARD_CONFIG from the process environment, so the
# differential sets it before any thread exists.
[[test]]
name = "differential"
harness = false

# Test-only surface (e.g. `BUILD_MANIFEST_DIR`). Off by default; the self
# dev-dependency below turns it on for every `cargo test`/`cargo clippy
# --all-targets` build without `--features`.
# - Absent from builds that do not activate dev-dependencies (`cargo build`,
#   `cargo install`, release.yaml), but `cargo test` (including `--release`,
#   the nix checkPhase) builds the binary under test with it on, so never gate
#   runtime behaviour on it.
# - Internal: not covered by semver, may be removed without notice.
# - Unit tests under src/ must use `crate::` paths, not `shguard::`: the lib's
#   unit-test target also links the lib through the self dev-dependency, so
#   the two sets of types would not match.
[features]
test-support = []

[dev-dependencies]
shguard = { path = ".", features = ["test-support"] }
assert_cmd = "2.2.2"
tempfile = "3.27.0"
