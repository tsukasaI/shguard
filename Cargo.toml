[workspace]
members = ["crates/shguard-kernel", "crates/shguard-syntax", "crates/shguard"]
resolver = "3"

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tsukasaI/shguard"
publish = false

# From coding-guidelines/templates/cargo-lints.toml.example, plus
# wildcard_enum_match_arm so a new variant cannot fall through a `_` arm.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(creusot)', 'cfg(kani)'] }

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }

unwrap_used = "warn"
expect_used = "warn"
missing_errors_doc = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
module_name_repetitions = "warn"
print_stdout = "warn"
print_stderr = "warn"
wildcard_imports = "warn"
indexing_slicing = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
redundant_clone = "warn"
missing_panics_doc = "warn"
fn_params_excessive_bools = "warn"
ref_option = "warn"
needless_for_each = "warn"
clone_on_ref_ptr = "warn"
string_add = "warn"
undocumented_unsafe_blocks = "warn"
wildcard_enum_match_arm = "deny"
